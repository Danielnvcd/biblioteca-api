# ═══════════════════════════════════════════════════════════════════════════
# CONFIG GLOBAL DE NGINX  →  va en  /etc/nginx/nginx.conf  del VPS
# ═══════════════════════════════════════════════════════════════════════════
# Este archivo define el entorno global (events, http{}). Adentro del http{}
# se incluyen los virtual hosts desde /etc/nginx/sites-enabled/, donde está
# el server{} específico de la API (ver: nginx/sites-available/biblioteca-api).
#
# CAMBIOS RESPECTO AL ORIGINAL DEL VPS:
#   1. client_max_body_size: 16m → 50m
#      (Spring multipart está en 50MB; con 16m se cortaban uploads >16MB.)
#   2. Agregado set_real_ip_from 127.0.0.1 y ::1
#      (Con Cloudflare Tunnel las requests entran desde localhost; sin estas
#       líneas nginx no confía en CF-Connecting-IP y Spring veía 127.0.0.1
#       como IP de todos los clientes → rate-limit per-IP roto.)
# ═══════════════════════════════════════════════════════════════════════════

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 4096;
    multi_accept on;
}

http {

    ##
    # BÁSICO
    ##
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ##
    # LOGS
    ##
    access_log /var/log/nginx/access.log;

    ##
    # COMPRESIÓN
    ##
    gzip on;
    gzip_disable "msie6";

    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;

    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/xhtml+xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf
        application/vnd.ms-fontobject;

    ##
    # CACHE DE ARCHIVOS (acelera imágenes y archivos estáticos)
    ##
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    ##
    # BUFFERS
    ##
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    # ⚠️ Debe coincidir con spring.servlet.multipart.max-file-size (50MB).
    client_max_body_size 50m;

    ##
    # SSL SEGURO
    ##
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    ##
    # IP REAL DEL CLIENTE (Cloudflare)
    ##
    real_ip_header CF-Connecting-IP;

    # ⚠️ Cloudflare Tunnel: cloudflared corre en el VPS y le pasa los requests
    # a nginx desde localhost. Sin estas dos líneas, nginx no reescribe
    # $remote_addr con la IP real del cliente y el rate-limit per-IP de Spring
    # cuenta a TODO el mundo como 127.0.0.1.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;

    # IPs públicas de Cloudflare — irrelevantes con Tunnel (cloudflared
    # conecta desde 127.0.0.1, no desde estos rangos), pero se dejan por si
    # algún día se sirve algún sitio con proxy DNS clásico.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;

    # IPv6 Cloudflare
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;

    ##
    # CACHE DE CONTENIDO ESTÁTICO
    ##
    map $sent_http_content_type $expires {
        default off;
        text/html epoch;
        text/css 30d;
        application/javascript 30d;
        ~image/ 30d;
        ~font/ 30d;
    }

    expires $expires;

    ##
    # HEADERS DE SEGURIDAD
    ##
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    ##
    # VIRTUAL HOSTS — acá entra el server{} de biblioteca-api
    ##
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
