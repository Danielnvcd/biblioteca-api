# Reference compose for local prod-like setup.
# Replace values in .env (not committed) before running:
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # TZ del SO del contenedor; -c timezone fuerza la TZ del servidor de
    # Postgres (que NO hereda TZ del SO — por defecto usa 'UTC' del
    # postgresql.conf de la imagen). Sin esto, NOW() y los TIMESTAMP sin TZ
    # quedaban en UTC mientras el back (Java) corre en Mexico_City, generando
    # desfases de 6h en password_changed_at, last_seen, etc.
    command: postgres -c timezone='America/Mexico_City'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biblioteca_maxipet}
      POSTGRES_USER: ${POSTGRES_USER:-bibliotecario}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: America/Mexico_City
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Tope de memoria para que la BD no asfixie al resto del host si una query
    # se descontrola. Ajustar si la BD crece mucho (subir y revisar shared_buffers).
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Solo lo usa el rate-limit (buckets de Bucket4j). No guarda sesiones ni
    # datos de negocio, así que no necesita persistencia: si se reinicia, los
    # contadores arrancan de cero y se vuelven a llenar solos.
    #
    # maxmemory-policy allkeys-lru para que, si alguna vez se llena, tire las
    # claves viejas en vez de empezar a rechazar escrituras — un bucket perdido
    # es un intento de más, un Redis que rechaza escrituras rompe el limitador.
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 200mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # Sin puertos publicados: solo lo alcanza la API por la red interna de
    # compose. Redis sin auth expuesto a internet es un problema conocido.
    mem_limit: 256m

  api:
    build: .
    restart: unless-stopped
    # UID/GID fijo para que los archivos creados en el bind-mount de uploads
    # tengan ownership predecible. El user `app` del Dockerfile se sobreescribe
    # a 1000:1000; nginx (www-data) en el host puede leer porque el umask 022
    # deja los archivos en 644 (others read).
    user: "1000:1000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-biblioteca_maxipet}
      DB_USERNAME: ${POSTGRES_USER:-bibliotecario}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (>= 64 chars base64)}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      RATE_LIMIT_ENABLED: "true"
      # Con backend=redis los contadores sobreviven reinicios de la API y se
      # comparten si algún día corren más de una instancia. Si Redis no
      # responde, RateLimitFilter deja pasar el request y loguea WARN: el
      # bloqueo por cuenta (en Postgres) sigue cubriendo la fuerza bruta.
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-redis}
      SPRING_DATA_REDIS_URL: ${SPRING_DATA_REDIS_URL:-redis://redis:6379}
      # Sólo poner =true en el .env si REALMENTE corrés Redis (RATE_LIMIT_BACKEND=redis).
      MANAGEMENT_HEALTH_REDIS_ENABLED: ${MANAGEMENT_HEALTH_REDIS_ENABLED:-false}
    volumes:
      # Bind-mount al host para que nginx pueda servir los uploads vía
      # X-Accel-Redirect (sendfile directo, sin pasar por la JVM). El path del
      # host debe existir antes del primer up y tener permisos para UID 1000.
      # Crear con: sudo mkdir -p /srv/biblioteca-uploads && sudo chown 1000:1000 /srv/biblioteca-uploads
      - /srv/biblioteca-uploads:/app/uploads
      # Access logs de Tomcat (METHOD path status tiempo). Bind-mount al host
      # para que puedas tail -f sin entrar al contenedor.
      - ./logs:/app/logs
    ports:
      # Bind a 127.0.0.1 — el backend solo lo ve Nginx en el mismo host. Sin
      # esto el puerto 8080 quedaría expuesto a 0.0.0.0 y cualquiera con la IP
      # pública del server podría bypasear Nginx + Cloudflare Tunnel + WAF.
      - "127.0.0.1:8080:8080"
    # La JVM ya respeta este tope vía MaxRAMPercentage=75 del Dockerfile,
    # así que el heap se queda ~768MB y deja aire para metaspace / threads.
    mem_limit: 1g

volumes:
  db-data:
