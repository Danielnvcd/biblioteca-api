server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/biblioteca_maxipet}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 600000
      connection-timeout: 30000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: ${DB_SCHEMA:public}
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    # Schema existente (prod / dev actual) se considera ya en V1. Flyway crea
    # flyway_schema_history en el primer arranque marcando V1 como baseline
    # y NO re-ejecuta V1; las siguientes migraciones (V2+) sí corren.
    # En BD vacía no hay baseline — Flyway corre V1 y V2 desde cero.
    baseline-version: 1
    locations: classpath:db/migration
    default-schema: ${DB_SCHEMA:public}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      accept-empty-string-as-null-object: true
    date-format: yyyy-MM-dd'T'HH:mm:ss

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 900000              # 15 min — short-lived access token
    refresh-expiration-ms: 604800000   # 7 days — refresh rotated on every use
  encryption:
    # Base64 of a random 256-bit key. Dev fallback so local runs work; prod
    # MUST set APP_ENCRYPTION_KEY (see application-prod.yml).
    key: ${APP_ENCRYPTION_KEY}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  allowed-extensions: pdf,doc,docx,ppt,pptx,xls,xlsx,xlsm,jpg,png,mp4,mp3,wav,heic
  super-admins: Vanesa Rivera,Daniel
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:false}
    # backend=memory está bien con UNA sola instancia. Si se despliegan varias
    # detrás de un load balancer, cada instancia mantiene su propio contador y
    # el límite efectivo se multiplica por N. En ese caso usar:
    #   RATE_LIMIT_BACKEND=redis
    #   SPRING_REDIS_HOST=...  SPRING_REDIS_PORT=6379
    # Ver RateLimitConfig para los buckets aplicados (login/2fa/register).
    backend: ${RATE_LIMIT_BACKEND:memory}

spring.data.web.pageable:
  default-page-size: 20
  max-page-size: 100
  one-indexed-parameters: false

logging:
  level:
    com.biblioteca: INFO

management:
  endpoints:
    web:
      exposure:
        # prometheus se mantiene fuera para no exponer métricas operacionales
        # (latencias, pool DB, endpoints) públicamente. Si se agrega un scraper,
        # habilitarlo en un puerto interno o con autenticación separada.
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    # spring-boot-starter-data-redis está en el classpath para soportar el
    # backend de rate-limit por Redis. Su health indicator se auto-activa e
    # intenta conectar a localhost:6379 aunque no estés usando Redis, dejando
    # el /actuator/health en DOWN y el container "unhealthy" para siempre.
    # Lo deshabilitamos por default; cuando uses RATE_LIMIT_BACKEND=redis,
    # poné MANAGEMENT_HEALTH_REDIS_ENABLED=true en el .env.
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}
  metrics:
    tags:
      application: biblioteca-api
