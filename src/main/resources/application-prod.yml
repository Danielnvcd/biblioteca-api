# Activate with SPRING_PROFILES_ACTIVE=prod (or --spring.profiles.active=prod).
# In prod, JWT_SECRET, DATABASE_URL, DB_USERNAME, DB_PASSWORD and CORS_ORIGINS
# MUST be provided via env vars — the defaults below intentionally fail-fast.
server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  forward-headers-strategy: framework   # honor X-Forwarded-* from a reverse proxy
  tomcat:
    accesslog:
      enabled: true
      directory: /app/logs
      prefix: access
      suffix: .log
      # %t time, %a IP del cliente real (gracias a forward-headers-strategy),
      # %r request line (METHOD path HTTP/x.x), %s status, %D tiempo en ms,
      # %B bytes enviados, %{User-Agent}i UA del cliente.
      pattern: '%t %a "%r" %s %D ms %B bytes "%{User-Agent}i"'
      rotate: true
      file-date-format: .yyyy-MM-dd
      max-days: 14

spring:
  jpa:
    hibernate:
      ddl-auto: validate                # NEVER let Hibernate alter prod schema
    open-in-view: false                 # close DB session at end of service layer
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      idle-timeout: 300000
      max-lifetime: 1500000
      connection-timeout: 20000
      leak-detection-threshold: 30000

logging:
  level:
    root: WARN
    com.biblioteca: INFO
    org.hibernate.SQL: WARN
  # Output format (JSON) is controlled by logback-spring.xml under the "prod" profile.

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never               # don't leak DB/disk details over health

app:
  jwt:
    # No fallback in prod. If JWT_SECRET isn't set, app refuses to start.
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  encryption:
    # No fallback in prod. Generate with: openssl rand -base64 32
    key: ${APP_ENCRYPTION_KEY}
  admin:
    # Unset by default in prod. Set ADMIN_INITIAL_PASSWORD on first boot only;
    # leaving it unset means no automatic admin is created.
    initial-password: ${ADMIN_INITIAL_PASSWORD:}
  # En prod, FileController responde con X-Accel-Redirect en lugar de servir el
  # archivo desde la JVM. nginx hace sendfile directo desde disco, liberando
  # el thread de Tomcat. La auth/role checks siguen pasando por Spring.
  # Requiere que nginx tenga `location /_protected/ { internal; alias ...; }`
  # apuntando al mismo path del filesystem donde Spring guarda los uploads.
  internal-redirect:
    enabled: true
    prefix: /_protected
  rate-limit:
    enabled: true
    # IMPORTANTE: si esta app corre con más de una instancia en prod, setear
    # RATE_LIMIT_BACKEND=redis (con SPRING_REDIS_HOST configurado). Con backend
    # memory (default) cada instancia tiene su propio contador y el límite
    # efectivo se vuelve N × el configurado, debilitando la protección.
